l_english:
 trait_ge_human:0 "Human"
 trait_ge_human_desc:0 "Humans have no extraordinary gifts. They learn quickly and adapt."
 trait_ge_human_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is human: adaptive, and quicker to master a lifestyle."
 trait_ge_elf:0 "Elf"
 trait_ge_elf_desc:0 "Forest-attuned people. Strong at diplomacy and intrigue, weak at martial."
 trait_ge_elf_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is an elf, more at home in courts and shadows than in the shield wall."
 trait_ge_orc:0 "Orc"
 trait_ge_orc_desc:0 "Marsh-attuned people. Strong at martial and learning, weak at stewardship."
 trait_ge_orc_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is an orc, built for war and study rather than ledgers."
 trait_ge_dwarf:0 "Dwarf"
 trait_ge_dwarf_desc:0 "Mountain-attuned people. Strong at stewardship and diplomacy, weak at intrigue."
 trait_ge_dwarf_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a dwarf, happier with gold and oaths than with knives in the dark."
 trait_ge_goblin:0 "Goblin"
 trait_ge_goblin_desc:0 "Smaller people with poor prowess and a gift for schemes."
 trait_ge_goblin_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a goblin. The body is slight. The plots are not."
 trait_ge_kobold:0 "Kobold"
 trait_ge_kobold_desc:0 "Small tunnel-folk. Clever with schemes and coin, frail in a duel."
 trait_ge_kobold_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a kobold, always counting exits and coins."
 trait_ge_merfolk:0 "Merfolk"
 trait_ge_merfolk_desc:0 "Coastal people who hate mountains and deserts. Gifted stewards."
 trait_ge_merfolk_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is merfolk, drawn to harbors and ledgers."
 trait_ge_troll:0 "Troll"
 trait_ge_troll_desc:0 "Swamp-born brutes who still like to stack gold."
 trait_ge_troll_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a troll: heavy-handed, and strangely fond of treasure."
 trait_ge_ogre:0 "Ogre"
 trait_ge_ogre_desc:0 "Giant mountain neighbors who would rather fight than read."
 trait_ge_ogre_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is an ogre. The argument usually ends on the floor."
 trait_ge_giant:0 "Giant"
 trait_ge_giant_desc:0 "Huge builders of castles and monuments."
 trait_ge_giant_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a giant, happiest when something tall is going up."
 trait_ge_yaksha:0 "Yaksha"
 trait_ge_yaksha_desc:0 "Temple guardians. Lawful, pious, and patient."
 trait_ge_yaksha_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a yaksha, more warden than warlord."
 trait_ge_nymph:0 "Nymph"
 trait_ge_nymph_desc:0 "Lustful feast-goers who chase strong bloodlines."
 trait_ge_nymph_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a nymph, always looking toward the next feast — or the next heir."
 trait_ge_fairy:0 "Fairy"
 trait_ge_fairy_desc:0 "Industrious nature-folk who keep the calendar full of celebrations."
 trait_ge_fairy_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a fairy, as serious about festivals as about work."
 trait_ge_centaur:0 "Centaur"
 trait_ge_centaur_desc:0 "Four-legged nomads of the open steppe."
 trait_ge_centaur_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a centaur. Standing still feels like a mistake."
 trait_ge_demon:0 "Demon"
 trait_ge_demon_desc:0 "Galzag's children. Built to conquer, and to ruin what they take."
 trait_ge_demon_character_desc:0 "[ROOT.GetFirstNameNoTooltip] carries Galzag's blood. People feel it before they can name it."
 trait_ge_naga:0 "Naga"
 trait_ge_naga_desc:0 "Desert serpent-folk. Readers of scripture and authors of plots."
 trait_ge_naga_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a naga, equally happy with a book or a scheme."
 trait_ge_chromatic_dragonborn:0 "Chromatic Dragonborn"
 trait_ge_chromatic_dragonborn_desc:0 "Red, blue, green, black, or white. The metallic lines are gone."
 trait_ge_chromatic_dragonborn_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is chromatic dragonborn, scholar and soldier in one skin."
 trait_ge_gem_dragonborn:0 "Gem Dragonborn"
 trait_ge_gem_dragonborn_desc:0 "Eastern dragonborn of jade, ruby, citrine, crystal, or sapphire."
 trait_ge_gem_dragonborn_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is gem dragonborn: calligraphy before conquest, usually."
 trait_ge_canine:0 "Canine"
 trait_ge_canine_desc:0 "Loyal pack-folk. Strong at diplomacy and martial."
 trait_ge_canine_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is canine. Family and friends come first. Then the sword."
 trait_ge_feline:0 "Feline"
 trait_ge_feline_desc:0 "Prideful rulers. Strong at martial and intrigue."
 trait_ge_feline_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is feline, and would rather give orders than take them."
 trait_ge_bovine:0 "Bovine"
 trait_ge_bovine_desc:0 "Horned farmers. They build, they graze, they endure."
 trait_ge_bovine_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is bovine. The fields come first."
 trait_ge_equine:0 "Equine"
 trait_ge_equine_desc:0 "Fast riders who joust, hunt, and keep long blood-books."
 trait_ge_equine_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is equine. A day without a ride is a wasted day."
 trait_ge_bear:0 "Bear"
 trait_ge_bear_desc:0 "Guardians who rule with a heavy kind of kindness."
 trait_ge_bear_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a bear, protective to a fault."
 trait_ge_deer:0 "Deer"
 trait_ge_deer_desc:0 "Independent hunters. Territorial, and proud of the antlers."
 trait_ge_deer_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a deer, and this ground is spoken for."
 trait_ge_avian:0 "Avian"
 trait_ge_avian_desc:0 "Bird-folk of peaks and tree-houses."
 trait_ge_avian_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is avian. Roofs feel too low."
 trait_ge_elephant:0 "Elephant"
 trait_ge_elephant_desc:0 "Large savannah people who live at the desert's edge."
 trait_ge_elephant_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is elephant-folk. Few try to shove past."
 trait_ge_hominid:0 "Hominid"
 trait_ge_hominid_desc:0 "Bhu-Puna's line. Mischievous, kind, and serious about dharma."
 trait_ge_hominid_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a hominid, halfway between a joke and a sermon."
 trait_ge_boar:0 "Boar"
 trait_ge_boar_desc:0 "Hearty finders of food and buried treasure."
 trait_ge_boar_character_desc:0 "[ROOT.GetFirstNameNoTooltip] is a boar. If it can be rooted up, it will be."
 trait_ge_holy_blood_partial:0 "Partial Holy Blood"
 trait_ge_holy_blood_partial_desc:0 "A thin inheritance from one of the progenitor deities."
 trait_ge_holy_blood_partial_character_desc:0 "[ROOT.GetFirstNameNoTooltip] carries a trace of holy blood."
 trait_ge_holy_blood_minor:0 "Minor Holy Blood"
 trait_ge_holy_blood_minor_desc:0 "Clear descent from a progenitor, still far from the source."
 trait_ge_holy_blood_minor_character_desc:0 "[ROOT.GetFirstNameNoTooltip] has minor holy blood."
 trait_ge_holy_blood_major:0 "Major Holy Blood"
 trait_ge_holy_blood_major_desc:0 "A strong ancestral line. Courts notice."
 trait_ge_holy_blood_major_character_desc:0 "[ROOT.GetFirstNameNoTooltip] has major holy blood."
 trait_ge_holy_blood_perfect:0 "Perfect Holy Blood"
 trait_ge_holy_blood_perfect_desc:0 "The line is complete. This is as close as mortals get to the progenitor."
 trait_ge_holy_blood_perfect_character_desc:0 "[ROOT.GetFirstNameNoTooltip] bears perfect holy blood."
